name: Build Quarkus app with Deployagram

on:
  workflow_dispatch

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 325701203566.dkr.ecr.eu-west-2.amazonaws.com
  CONTAINER_NAME: BookOverflow

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Any network will do, as long as registry can reach kafka
      - name: Create Docker Network
        run: |
          docker network create deployagram

      - name: Build with Maven
        run: ./mvnw -B clean package

      # Insert Step here to really deploy your app to your Prod environment
