quarkus.rest-client."com.deployagram.demo.quarkus.ClassicBookClient".url=https://tbd
%test.quarkus.rest-client."com.deployagram.demo.quarkus.ClassicBookClient".url=http://localhost:9080
%test.quarkus.wiremock.devservices.port=9050
%test.quarkus.kafka.devservices.enabled=false

# Kafka
mp.messaging.outgoing.suggestions.connector=smallrye-kafka
mp.messaging.outgoing.suggestions.topic=SuppliedSuggestionsTopic
mp.messaging.outgoing.suggestions.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.connector.smallrye-kafka.schema.registry.url=http://localhost:8081

# Deployagram Kafka Producer Config
#%test.mp.messaging.outgoing.suggestions.interceptor.classes=com.deployagram.kafka.interceptors.LoggingProducerInterceptor
%test.mp.messaging.outgoing.suggestions.interceptor.classes=com.deployagram.kafka.interceptors.SchemaAwareProducerInterceptor
%test.mp.messaging.outgoing.suggestions.logger.hostname=localhost
%test.mp.messaging.outgoing.suggestions.logger.port=1152
%test.mp.messaging.outgoing.suggestions.producing.app.name.SuppliedSuggestionsTopic=BookOverflow
